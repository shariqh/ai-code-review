name: AI code review
description: Adversarial pull request review with GitHub Copilot CLI and a sticky PR comment

inputs:
  copilot-token:
    description: Fine-grained PAT with the Copilot Requests permission
    required: true
  github-token:
    description: Caller repository GITHUB_TOKEN used to manage the sticky comment
    required: true
  model:
    description: Copilot CLI model identifier of the finder
    required: false
    default: gpt-5.6-sol
  verifier-model:
    description: >-
      Copilot CLI model identifier of the verifier, which checks each finding
      against the code before it is posted. Empty turns verification off:
      findings are then listed unverified and none is posted inline.
    required: false
    default: gpt-5.6-sol
  verifier-effort:
    description: Reasoning effort passed to Copilot CLI for the verifier
    required: false
    default: low
  max-verifications:
    description: Maximum verifier calls per run, one per finding
    required: false
    default: "10"
  max-nits:
    description: Maximum findings of severity Nit reported per review
    required: false
    default: "3"
  inline-comments:
    description: >-
      Post each confirmed finding as an inline review comment on its line, in
      addition to the sticky comment
    required: false
    default: "true"
  copilot-cli-version:
    description: Exact @github/copilot package version
    required: false
    default: 1.0.74
  node-version:
    description: Node.js version passed to actions/setup-node
    required: false
    default: lts/*
  reasoning-effort:
    description: Reasoning effort passed to Copilot CLI
    required: false
    default: high
  context:
    description: Context tier passed to Copilot CLI
    required: false
    default: long_context
  batch-max-bytes:
    description: Target maximum bytes per review batch
    required: false
    default: "50000"
  file-max-bytes:
    description: Maximum bytes reviewed from one changed file
    required: false
    default: "120000"
  max-batches:
    description: Maximum model calls per pull request
    required: false
    default: "8"
  owner-only:
    description: Restrict reviews to PRs authored by the repository owner
    required: false
    default: "true"
  context-file:
    description: >-
      Repo-relative path to a maintainer-authored review-context file
      (conventions, known false positives) injected into the review prompt.
      Read from the PR BASE ref, never the PR head, so a pull request cannot
      rewrite the instructions that review it. Empty string disables it;
      a missing file is skipped silently.
    required: false
    default: .github/ai-review-context.md
  review-file:
    description: >-
      Repo-relative path to the repository's review guide (what a failure
      looks like here, paths to skip, decisions taken), injected into the
      finder's and verifier's prompts. Read from the PR BASE ref like
      context-file. Empty string disables it; a missing file is skipped.
    required: false
    default: REVIEW.md
  full-files-max-bytes:
    description: >-
      Bytes of the head version of the touched files sent with each batch,
      numbered by line, so the finder can check how changed code is called;
      0 leaves them out
    required: false
    default: "60000"
  comment-marker:
    description: Identifier used for the sticky PR comment
    required: false
    default: ai-code-review-sticky
  verify-landed:
    description: >-
      Fail the job unless the sticky comment now covers the pull request's
      current head from this run attempt. With this on, a missing
      copilot-token also fails the job (see allow-missing-token). The
      reusable workflow turns this on.
    required: false
    default: "false"
  allow-missing-token:
    description: >-
      Skip with a warning instead of failing when copilot-token is empty and
      verify-landed is on. For smoke tests that run without the secret.
    required: false
    default: "false"
  review-scope:
    description: >-
      full reviews the whole pull request on every run. since-last-review
      reviews it in full once, then only the commits since the head this
      reviewer last reviewed completely, falling back to a full review when
      that head cannot be trusted (see the README).
    required: false
    default: full

runs:
  using: composite
  steps:
    - name: Check review eligibility
      id: guard
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
        WORKFLOW_ACTOR: ${{ github.actor }}
        WORKFLOW_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        OWNER_ONLY: ${{ inputs.owner-only }}
        VERIFY_LANDED: ${{ inputs.verify-landed }}
        ALLOW_MISSING_TOKEN: ${{ inputs.allow-missing-token }}
        REVIEW_SCOPE: ${{ inputs.review-scope }}
        REVIEW_MODEL: ${{ inputs.model }}
        VERIFIER_MODEL: ${{ inputs.verifier-model }}
        VERIFIER_EFFORT: ${{ inputs.verifier-effort }}
        MAX_VERIFICATIONS: ${{ inputs.max-verifications }}
        MAX_NITS: ${{ inputs.max-nits }}
        INLINE_COMMENTS: ${{ inputs.inline-comments }}
        FULL_FILES_MAX_BYTES: ${{ inputs.full-files-max-bytes }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token }}
        REVIEW_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: "$GITHUB_ACTION_PATH/scripts/guard.sh"

    - name: Set up Node
      if: steps.guard.outputs.skip == 'false'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Check runner prerequisites
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/preflight.sh"

    - name: Install Copilot CLI
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        COPILOT_CLI_VERSION: ${{ inputs.copilot-cli-version }}
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        NPM_CONFIG_USERCONFIG: /dev/null
      working-directory: ${{ runner.temp }}
      run: >-
        npm install --global --ignore-scripts
        "@github/copilot@$COPILOT_CLI_VERSION"

    - name: Check out pull request
      if: steps.guard.outputs.skip == 'false'
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha }}
        path: .ai-code-review-pr-${{ github.run_id }}-${{ github.run_attempt }}

    # Only for review-scope since-last-review: read the head this reviewer
    # last reviewed from its own sticky comment.
    - name: Find this reviewer's last review
      id: last-review
      if: steps.guard.outputs.skip == 'false' && inputs.review-scope == 'since-last-review'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
      run: "$GITHUB_ACTION_PATH/scripts/last-review.sh"

    - name: Build review batches
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REVIEW_REPO_DIR: ${{ github.workspace }}/.ai-code-review-pr-${{ github.run_id }}-${{ github.run_attempt }}
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
        BATCH_MAX_BYTES: ${{ inputs.batch-max-bytes }}
        FILE_MAX_BYTES: ${{ inputs.file-max-bytes }}
        MAX_BATCHES: ${{ inputs.max-batches }}
        CONTEXT_FILE: ${{ inputs.context-file }}
        REVIEW_FILE: ${{ inputs.review-file }}
        REVIEW_SCOPE: ${{ inputs.review-scope }}
        LAST_REVIEWED_SHA: ${{ steps.last-review.outputs.reviewed-commit }}
        LAST_FULL_REVIEW_SHA: ${{ steps.last-review.outputs.full-review }}
        LAST_REVIEW_RESULT: ${{ steps.last-review.outputs.result }}
        LAST_BASE_REF: ${{ steps.last-review.outputs.base-ref }}
        LAST_MERGE_BASE: ${{ steps.last-review.outputs.merge-base }}
      run: "$GITHUB_ACTION_PATH/scripts/prepare-review.sh"

    - name: Read the pull request's description
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
      run: "$GITHUB_ACTION_PATH/scripts/pr-context.sh"

    - name: Run adversarial review
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token }}
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
        REVIEW_MODEL: ${{ inputs.model }}
        REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        CONTEXT_TIER: ${{ inputs.context }}
        MAX_NITS: ${{ inputs.max-nits }}
        MAX_VERIFICATIONS: ${{ inputs.max-verifications }}
        VERIFIER_MODEL: ${{ inputs.verifier-model }}
        FULL_FILES_MAX_BYTES: ${{ inputs.full-files-max-bytes }}
      run: "$GITHUB_ACTION_PATH/scripts/run-review.sh"

    # Reads the checkout, so it runs without the Copilot token: the head
    # version of each file a finding names, what the pull request changes in
    # it, and where the identifiers the finding names appear.
    - name: Gather verification evidence
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        REVIEW_REPO_DIR: ${{ github.workspace }}/.ai-code-review-pr-${{ github.run_id }}-${{ github.run_attempt }}
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: >-
        node "$GITHUB_ACTION_PATH/scripts/review-files.mjs" verify-context
        "$REVIEW_WORK_DIR" "$REVIEW_REPO_DIR" "$HEAD_SHA"

    - name: Verify findings
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token }}
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
        VERIFIER_MODEL: ${{ inputs.verifier-model }}
        VERIFIER_EFFORT: ${{ inputs.verifier-effort }}
        CONTEXT_TIER: ${{ inputs.context }}
      run: "$GITHUB_ACTION_PATH/scripts/verify-findings.sh"

    - name: Post sticky review comment
      if: steps.guard.outputs.skip == 'false'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        REVIEW_MODEL: ${{ inputs.model }}
        VERIFIER_MODEL: ${{ inputs.verifier-model }}
        VERIFIER_EFFORT: ${{ inputs.verifier-effort }}
        INLINE_COMMENTS: ${{ inputs.inline-comments }}
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
      run: "$GITHUB_ACTION_PATH/scripts/post-comment.sh"

    - name: Fail when every review or verification call failed
      if: steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
      run: "$GITHUB_ACTION_PATH/scripts/check-result.sh"

    - name: Verify the review landed on this run's head
      if: steps.guard.outputs.skip == 'false' && inputs.verify-landed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        COMMENT_MARKER: ${{ inputs.comment-marker }}
      run: "$GITHUB_ACTION_PATH/scripts/verify-landed.sh"

    - name: Clean review workspace
      if: always() && steps.guard.outputs.skip == 'false'
      shell: bash
      env:
        REVIEW_REPO_DIR: ${{ github.workspace }}/.ai-code-review-pr-${{ github.run_id }}-${{ github.run_attempt }}
        REVIEW_WORK_DIR: ${{ runner.temp }}/ai-code-review-${{ github.run_id }}-${{ github.run_attempt }}
      run: "$GITHUB_ACTION_PATH/scripts/cleanup.sh"
