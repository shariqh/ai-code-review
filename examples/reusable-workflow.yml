name: AI code review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    # Pin to a release commit SHA once the pilot works. The reviewer jobs run
    # the action from the same commit, so the pin covers both.
    uses: shariqh/ai-code-review/.github/workflows/review.yml@main
    # Optional: a self-hosted lane, a second reviewer (the default is Astra alone), and later rounds
    # that review only the commits since each reviewer's last review.
    # with:
    #   runs-on: '["self-hosted","copilot-review"]'
    #   review-scope: since-last-review
    #   reviewers: >-
    #     [{"name": "Astra", "model": "gpt-6-astra", "marker": "ai-code-review-sticky-astra",
    #     "timeout-minutes": 40},
    #     {"name": "Sol", "model": "gpt-5.6-sol", "marker": "ai-code-review-sticky"}]
    secrets:
      COPILOT_REVIEW_PAT: ${{ secrets.COPILOT_REVIEW_PAT }}
