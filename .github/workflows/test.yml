name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Load composite action
        uses: ./
        with:
          copilot-token: ""
          github-token: not-used-on-push

      - name: Run tests
        run: bash tests/test.sh

  # Call the reusable workflow the way a consumer does, once per runs-on form.
  # No COPILOT_REVIEW_PAT is passed, so every reviewer job takes the action's
  # missing-token skip: this checks the inputs, the reviewer matrix, runner
  # parsing and the self-checkout without spending Copilot quota. The job
  # permissions match what the reusable workflow requests.
  reusable-json-runner:
    name: reusable (JSON runs-on, default reviewers)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/review.yml
    with:
      runs-on: '["ubuntu-latest"]'

  reusable-label-runner:
    name: reusable (label runs-on, one reviewer)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/review.yml
    with:
      runs-on: ubuntu-latest
      reviewers: '[{"model": "gpt-5.6-sol", "marker": "ai-code-review-smoke"}]'
